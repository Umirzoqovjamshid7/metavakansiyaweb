<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arizalar — Admin</title><style>body{font:15px Arial;margin:30px;color:#222}input,button{padding:12px;margin:5px}button{background:#00aeef;color:white;border:0;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{border:1px solid #ddd;padding:9px;text-align:left}th{background:#eee}.scroll{overflow-x:auto}</style><h1>Kelgan arizalar</h1><p>Admin tokenni kiriting (serverdagi ADMIN_TOKEN).</p><input type="password" id="token" placeholder="Admin token"><button id="load">Arizalarni ko‘rish</button><p id="status"></p><div class="scroll"><table id="table"></table></div><script>document.getElementById('load').onclick=async()=>{const table=document.getElementById('table');table.replaceChildren();const status=document.getElementById('status');try{const r=await fetch('/api/applications',{headers:{'X-Admin-Token':document.getElementById('token').value}});if(!r.ok)throw Error('Token noto‘g‘ri yoki serverda ADMIN_TOKEN belgilanmagan');const rows=await r.json();status.textContent=rows.length+' ta ariza';if(!rows.length)return;const keys=Object.keys(rows[0]);const head=table.createTHead().insertRow();keys.forEach(k=>{const th=document.createElement('th');th.textContent=k;head.append(th)});const body=table.createTBody();rows.forEach(row=>{const tr=body.insertRow();keys.forEach(k=>{const td=tr.insertCell();td.textContent=row[k]??''})})}catch(e){status.textContent=e.message}}</script></html>
