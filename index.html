<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formani to'liq to'ldiring (Hiring)</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#111}.wrap{width:min(714px,calc(100% - 30px));margin:160px auto 60px}.intro{font-size:30px;line-height:1.38;text-align:center;font-weight:400;padding:0 18px 19px;border-bottom:1px solid #ececec;margin:0 0 18px}.form{max-width:635px;margin:auto}.field{margin-bottom:18px}.control{width:100%;min-height:65px;background:#f1f1f1;border:1px solid #dedede;border-radius:5px;padding:16px 13px;font:17px Arial;color:#222;outline:none}.control:focus{border-color:#00aef0;background:#fff}.control::placeholder{color:#808080;opacity:1}textarea.control{height:130px;resize:vertical}select.control{color:#777;appearance:auto}select.control:valid{color:#222}.required{color:#f46d6d}.phone-label{font-size:14px;color:#808080;display:block;margin-bottom:2px}.phone-box{padding-top:9px;padding-bottom:9px}.phone-box input{border:0;background:transparent;outline:0;width:100%;font-size:17px}.more{display:block;border:0;background:none;color:#555;font-size:17px;padding:0 0 18px;cursor:pointer}.send{width:100%;background:#00aeef;border:0;border-radius:5px;color:white;font-weight:bold;font-size:18px;padding:20px;cursor:pointer}.send:hover{background:#009bd6}.status{margin:12px 0;text-align:center;min-height:20px}label.sr{position:absolute;left:-9999px}@media(max-width:700px){.wrap{margin:55px auto 30px}.intro{font-size:23px;padding:0 0 18px}.control{font-size:16px}}
</style></head><body><main class="wrap"><h1 class="intro">CV'ingizni qanchalik batafsil va to‘liq to‘ldirsangiz, suhbatga taklif qilinish va ishga qabul qilinish imkoniyatingiz shunchalik yuqori bo‘ladi. Har bir savolga imkon qadar batafsil javob bering. To‘liq to‘ldirilgan CV'lar ustuvor tartibda ko‘riladi.</h1><form class="form" id="form">
<div class="field"><input class="control" name="name" placeholder="Ism *" aria-label="Ism" required></div>
<div class="field"><div class="control phone-box"><label class="phone-label" for="phone">Telefon raqamingiz <span class="required">*</span></label><input id="phone" name="phone" value="+998" type="tel" required></div></div>
<button class="more" type="button" id="more">+ Добавить еще</button>
<div class="field"><div class="control phone-box"><label class="phone-label" for="extra_phone">Qo'shimcha telefon raqamingizni kiriting <span class="required">*</span></label><input id="extra_phone" name="extra_phone" value="+998" type="tel" required></div></div>
<div class="field"><input class="control" name="birth_date" placeholder="Tug'ilgan sana *" aria-label="Tug'ilgan sana" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required></div>
<div class="field"><input class="control" name="address" placeholder="Yashash manzilingiz *" required></div>
<div class="field"><select class="control" name="tashkent" required><option value="" disabled selected>Toshkentga kelib ishlay olasizmi? *</option><option>Ha</option><option>Yo'q</option></select></div>
<div class="field"><input class="control" name="telegram" placeholder="Telegram username *" required></div>
<div class="field"><select class="control" name="full_time" required><option value="" disabled selected>To'liq kun ishlay olasizmi? *</option><option>Ha</option><option>Yo'q</option></select></div>
<div class="field"><input class="control" name="workplaces" placeholder="Avval qayerlarda ishlagansiz *" required></div>
<div class="field"><input class="control" name="education" placeholder="Qayerda tahsil olgansiz *" required></div>
<div class="field"><input class="control" name="languages" placeholder="Qaysi tillarni bilasiz *" required></div>
<div class="field"><input class="control" name="genres" placeholder="Qaysi janrdagi kitoblar o'qiysiz *" required></div>
<div class="field"><input class="control" name="achievements" placeholder="Hayotda erishgan yutuqlaringiz *" required></div>
<div class="field"><input class="control" name="programs" placeholder="Qaysi programmalarda ishlay olasiz *" required></div>
<div class="field"><input class="control" name="books" placeholder="O'qigan kitoblaringiz *" required></div>
<div class="field"><input class="control" name="skills" placeholder="Yana qanday qobiliyatingiz bor *" required></div>
<div class="field"><textarea class="control" name="additional" placeholder="Qo'shimcha qilmoqchi bo'lsangiz yozib qoldiring *" required></textarea></div>
<button class="send" type="submit">Yuborish</button><div class="status" id="status" role="status"></div></form></main><script>
const form=document.getElementById('form'),status=document.getElementById('status');document.getElementById('more').addEventListener('click',()=>document.getElementById('extra_phone').focus());form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Yuborilmoqda...';const data=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(typeof result.detail==='string'?result.detail:'Ma’lumotlarni tekshiring');status.textContent='Arizangiz muvaffaqiyatli yuborildi!';form.reset();}catch(err){status.textContent='Xatolik: '+err.message}});
</script></body></html>
